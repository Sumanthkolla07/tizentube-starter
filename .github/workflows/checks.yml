name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Record tool versions
        run: |
          python --version
          python -c "import zlib; print('zlib', zlib.ZLIB_RUNTIME_VERSION)"
          node --version
      - name: Python packaging tests
        run: python -m unittest discover -s tests -p "*_test.py"
      - name: Launcher and proxy behavior tests
        run: node --test tests/launcher.test.cjs tests/proxy.test.cjs
      - name: Proxy syntax
        run: node --check tizentube-handoff/source/service/dist/index.js
      - name: Build community kit
        run: python scripts/make_share_kit.py
      - name: Verify manifest and clean extraction rebuild
        run: python scripts/verify_share_kit.py
